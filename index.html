<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>健康打卡</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #f6f6f9; --card: #fff; --text: #18181b; --sub: #8a8a93;
  --sep: #ececf1; --accent: #4f46e5; --accent-soft: #eef0ff; --green: #22c55e; --red: #ef4444;
}
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; max-width: 430px; margin: 0 auto; padding-bottom: 92px; -webkit-font-smoothing: antialiased; }

/* ── Header ── */
.header { padding: 22px 22px 8px; }
.header-row { display: flex; justify-content: space-between; align-items: flex-end; }
.header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -.02em; }
.date-sub { font-size: .72rem; color: var(--sub); margin-top: 3px; font-weight: 500; }

/* ── Banners ── */
.done-banner { margin: 0 18px 10px; background: var(--green); border-radius: 16px; padding: 11px 16px; color: #fff; font-size: .84rem; font-weight: 600; text-align: center; display: none; }
.done-banner.show { display: block; }

/* ── Section label ── */
.sec-label { font-size: .66rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--sub); padding: 12px 22px 6px; }

/* ── Med grid ── */
.meds-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 18px 4px; }
.med-card { background: var(--card); border-radius: 18px; padding: 13px 14px 12px; box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 4px 14px rgba(0,0,0,.03); min-width: 0; }
.med-card.ended { opacity: .4; pointer-events: none; }
.card-top { margin-bottom: 9px; }
.card-head { display: flex; align-items: flex-start; gap: 7px; }
.color-bar { width: 3px; min-height: 16px; border-radius: 99px; flex-shrink: 0; margin-top: 2px; }
.med-name { font-size: .87rem; font-weight: 700; flex: 1; min-width: 0; line-height: 1.3; }
.course-tag { font-size: .58rem; font-weight: 700; padding: 2px 7px; border-radius: 99px; white-space: nowrap; flex-shrink: 0; margin-top: 1px; }
.med-desc { font-size: .63rem; color: var(--sub); margin: 3px 0 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dose-row { display: flex; align-items: center; justify-content: space-between; gap: 5px; margin-top: 9px; }
.dose-dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 26px; height: 26px; border-radius: 50%; border: none; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: .65rem; font-weight: 600; color: var(--sub); cursor: pointer; transition: all .15s; flex-shrink: 0; user-select: none; -webkit-user-select: none; }
.dot:active { transform: scale(.88); }
.dot.filled { background: var(--c); color: #fff; font-size: .74rem; }
.dose-label { font-size: .66rem; color: var(--sub); white-space: nowrap; font-weight: 600; }
.dose-label.complete { color: var(--green); font-weight: 700; }
.skip-msg { font-size: .63rem; color: var(--sub); padding: 5px 0 0; display: none; }
.skip-msg.show { display: block; }

/* ── Braces card ── */
.braces-card { margin: 0 18px 10px; background: var(--card); border-radius: 18px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 4px 14px rgba(0,0,0,.03); }
.braces-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.braces-set-num { font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em; }
.braces-day-tag { font-size: .68rem; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.braces-status { font-size: .78rem; color: var(--sub); font-weight: 500; }
.braces-status.urgent { color: var(--red); font-weight: 700; }

/* ── History ── */
.usage-wrap { padding: 4px 18px 6px; }
.usage-card { background: var(--card); border-radius: 18px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 4px 14px rgba(0,0,0,.03); margin-bottom: 4px; }
.usage-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--sep); }
.usage-row:last-child { border-bottom: none; }
.usage-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.usage-name { font-size: .84rem; font-weight: 600; flex: 1; min-width: 0; }
.usage-stat { font-size: .72rem; color: var(--sub); text-align: right; white-space: nowrap; }
.usage-stat b { color: var(--text); font-weight: 700; }

.hist-wrap { padding: 6px 0 10px; }
.hist-day { margin: 0 18px 12px; }
.hist-date { font-size: .68rem; font-weight: 700; color: var(--sub); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; padding-left: 2px; }
.hist-card { background: var(--card); border-radius: 18px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 4px 14px rgba(0,0,0,.03); }
.hist-row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--sep); }
.hist-row:last-child { border-bottom: none; }
.hist-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.hist-name { font-size: .83rem; flex: 1; }
.hist-count { font-size: .7rem; color: var(--sub); }
.hist-icon { font-size: .88rem; }
.empty { text-align: center; padding: 70px 24px; color: var(--sub); font-size: .88rem; line-height: 1.9; }

/* ── Settings ── */
.settings-section { margin: 0 18px 22px; }
.settings-card { background: var(--card); border-radius: 18px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 4px 14px rgba(0,0,0,.03); }
.settings-row { display: flex; align-items: center; gap: 10px; padding: 13px 15px; border-bottom: 1px solid var(--sep); cursor: pointer; transition: background .15s; }
.settings-row:last-child { border-bottom: none; }
.settings-row:active { background: var(--bg); }
.s-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.s-name { font-size: .88rem; flex: 1; font-weight: 500; }
.s-meta { font-size: .7rem; color: var(--sub); }
.s-arrow { color: var(--sub); font-size: .8rem; }
.add-btn { width: 100%; margin-top: 10px; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 14px; font-size: .88rem; font-weight: 600; font-family: inherit; cursor: pointer; }
.add-btn.secondary { background: var(--card); color: var(--accent); border: 1.5px solid var(--accent); margin-top: 8px; }
.danger-btn { width: 100%; margin-top: 8px; padding: 14px; background: var(--card); color: var(--red); border: 1.5px solid var(--red); border-radius: 14px; font-size: .88rem; font-weight: 600; font-family: inherit; cursor: pointer; }

/* ── Edit sheet (overlay) ── */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 200; display: none; align-items: flex-end; }
.overlay.show { display: flex; }
.sheet { background: var(--card); width: 100%; max-width: 430px; margin: 0 auto; border-radius: 26px 26px 0 0; padding: 22px 20px env(safe-area-inset-bottom, 26px); max-height: 90vh; overflow-y: auto; }
.sheet-handle { width: 36px; height: 4px; background: var(--sep); border-radius: 99px; margin: 0 auto 20px; }
.sheet-title { font-size: 1.08rem; font-weight: 700; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; }
.sheet-close { background: var(--bg); border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: .9rem; color: var(--sub); display: flex; align-items: center; justify-content: center; }
.field-label { font-size: .72rem; font-weight: 600; color: var(--sub); margin-bottom: 6px; letter-spacing: .05em; text-transform: uppercase; }
.field-input { width: 100%; border: 1.5px solid var(--sep); border-radius: 12px; padding: 11px 13px; font-size: .9rem; font-family: inherit; color: var(--text); background: var(--bg); outline: none; margin-bottom: 14px; }
.field-input:focus { border-color: var(--accent); }
.stepper { display: flex; align-items: center; gap: 0; margin-bottom: 14px; border: 1.5px solid var(--sep); border-radius: 12px; overflow: hidden; background: var(--bg); }
.stepper-btn { width: 44px; height: 42px; border: none; background: none; font-size: 1.3rem; color: var(--accent); cursor: pointer; font-family: inherit; flex-shrink: 0; }
.stepper-btn:active { background: var(--sep); }
.stepper-val { flex: 1; text-align: center; font-size: .95rem; font-weight: 600; }
.amount-row { display: flex; gap: 8px; align-items: stretch; }
.amount-row .stepper { flex: 1; margin-bottom: 14px; }
.amount-row .field-input { width: 88px; margin-bottom: 14px; flex-shrink: 0; }
.color-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.color-swatch { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: all .15s; flex-shrink: 0; }
.color-swatch.selected { border-color: var(--text); transform: scale(1.15); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; margin-bottom: 14px; }
.toggle-label { font-size: .88rem; }
.toggle { width: 48px; height: 28px; background: var(--sep); border-radius: 99px; position: relative; cursor: pointer; transition: background .2s; flex-shrink: 0; }
.toggle.on { background: var(--green); }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; background: #fff; border-radius: 50%; transition: transform .2s; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
.toggle.on::after { transform: translateX(20px); }
.save-btn { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 14px; font-size: .95rem; font-weight: 700; font-family: inherit; cursor: pointer; margin-top: 4px; }
.del-link { display: block; text-align: center; color: var(--red); font-size: .8rem; margin-top: 14px; cursor: pointer; padding: 6px; }

/* ── Tabbar ── */
.tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: rgba(255,255,255,.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--sep); display: flex; padding: 8px 0 env(safe-area-inset-bottom, 10px); }
.tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; cursor: pointer; color: var(--sub); font-family: inherit; padding: 5px 0; transition: color .15s; }
.tab-btn.active { color: var(--accent); }
.tab-icon { font-size: 1.3rem; }
.tab-label { font-size: .6rem; font-weight: 600; }

/* ── Pages ── */
.page { display: none; }
.page.active { display: block; }

/* ── Toast ── */
.toast { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%) translateY(8px); background: rgba(24,24,27,.9); backdrop-filter: blur(10px); color: #fff; padding: 10px 20px; border-radius: 99px; font-size: .8rem; font-weight: 500; opacity: 0; transition: all .22s; z-index: 999; white-space: nowrap; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- Today -->
<div class="page active" id="pg-today">
  <div class="header">
    <div class="header-row">
      <h1>今日打卡</h1>
    </div>
    <div class="date-sub" id="dateLabel"></div>
  </div>
  <div class="done-banner" id="doneBanner">🎉 今日全部完成！</div>
  <div id="medsContainer"></div>
  <div id="bracesContainer"></div>
</div>

<!-- History -->
<div class="page" id="pg-history">
  <div class="header"><h1>打卡记录</h1></div>
  <div class="sec-label">用量统计</div>
  <div class="usage-wrap" id="usageWrap"></div>
  <div class="sec-label">每日明细</div>
  <div class="hist-wrap" id="histWrap"><div class="empty">📭 还没有记录</div></div>
</div>

<!-- Settings -->
<div class="page" id="pg-settings">
  <div class="header"><h1>管理</h1></div>

  <div class="sec-label">用药</div>
  <div class="settings-section">
    <div class="settings-card" id="medsSettingsList"></div>
    <button class="add-btn" onclick="openAddMed()">＋ 添加新药品</button>
  </div>

  <div class="sec-label">牙套</div>
  <div class="settings-section">
    <div class="settings-card">
      <div class="settings-row" onclick="openEditBraces()">
        <span class="s-dot" style="background:#4f46e5"></span>
        <span class="s-name">牙套进度设置</span>
        <span class="s-meta" id="bracesSettingsMeta"></span>
        <span class="s-arrow">›</span>
      </div>
    </div>
  </div>
</div>

<!-- Tabbar -->
<div class="tabbar">
  <button class="tab-btn active" onclick="showPage('today',this)"><span class="tab-icon">💊</span><span class="tab-label">今日</span></button>
  <button class="tab-btn" onclick="showPage('history',this)"><span class="tab-icon">📋</span><span class="tab-label">记录</span></button>
  <button class="tab-btn" onclick="showPage('settings',this)"><span class="tab-icon">⚙️</span><span class="tab-label">管理</span></button>
</div>

<!-- Edit Med Sheet -->
<div class="overlay" id="medOverlay" onclick="closeMedSheet(event)">
  <div class="sheet" id="medSheet">
    <div class="sheet-title">
      <span id="sheetTitle">编辑药品</span>
      <button class="sheet-close" onclick="closeMedSheet()">✕</button>
    </div>

    <div class="field-label">药品名称</div>
    <input class="field-input" id="f-name" placeholder="例：埃美丁" maxlength="20">

    <div class="field-label">说明（可选）</div>
    <input class="field-input" id="f-desc" placeholder="例：富马酸依美斯汀 · 每日3次" maxlength="40">

    <div class="field-label">颜色</div>
    <div class="color-row" id="colorRow"></div>

    <div class="field-label">每日次数</div>
    <div class="stepper">
      <button class="stepper-btn" onclick="stepDaily(-1)">−</button>
      <span class="stepper-val" id="f-daily-val">2</span>
      <button class="stepper-btn" onclick="stepDaily(1)">＋</button>
    </div>

    <div class="field-label">每次用量（可选，如 2 粒 / 1 滴）</div>
    <div class="amount-row">
      <div class="stepper">
        <button class="stepper-btn" onclick="stepAmount(-1)">−</button>
        <span class="stepper-val" id="f-amount-val">1</span>
        <button class="stepper-btn" onclick="stepAmount(1)">＋</button>
      </div>
      <input class="field-input" id="f-unit" placeholder="单位" maxlength="4">
    </div>

    <div class="toggle-row">
      <span class="toggle-label">隔天服用（每2天一次）</span>
      <div class="toggle" id="f-every-toggle" onclick="toggleEvery()"></div>
    </div>

    <div id="startDateField">
      <div class="field-label">开始日期（用于计算用药进度）</div>
      <input class="field-input" id="f-startDate" type="date">
    </div>

    <div class="field-label">疗程结束日期（留空 = 不限）</div>
    <input class="field-input" id="f-endDate" type="date">

    <button class="save-btn" onclick="saveMed()">保存</button>
    <span class="del-link" id="delLink" onclick="deleteMed()">删除此药品</span>
  </div>
</div>

<!-- Edit Braces Sheet -->
<div class="overlay" id="bracesOverlay" onclick="closeBracesSheet(event)">
  <div class="sheet">
    <div class="sheet-title">
      牙套设置
      <button class="sheet-close" onclick="closeBracesSheet()">✕</button>
    </div>
    <div class="field-label">当前副数（现在戴第几副）</div>
    <div class="stepper">
      <button class="stepper-btn" onclick="stepBraces('cur',-1)">−</button>
      <span class="stepper-val" id="b-cur-val">14</span>
      <button class="stepper-btn" onclick="stepBraces('cur',1)">＋</button>
    </div>
    <div class="field-label">本副开始日期</div>
    <input class="field-input" id="b-startDate" type="date">
    <div class="field-label">每副佩戴天数</div>
    <div class="stepper">
      <button class="stepper-btn" onclick="stepBraces('days',-1)">−</button>
      <span class="stepper-val" id="b-days-val">10</span>
      <button class="stepper-btn" onclick="stepBraces('days',1)">＋</button>
    </div>
    <div class="field-label">总副数</div>
    <div class="stepper">
      <button class="stepper-btn" onclick="stepBraces('total',-1)">−</button>
      <span class="stepper-val" id="b-total-val">19</span>
      <button class="stepper-btn" onclick="stepBraces('total',1)">＋</button>
    </div>
    <button class="save-btn" onclick="saveBraces()">保存</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── Constants ──────────────────────────────────────
const KEY = 'tracker_v8';
const COLORS = ['#007aff','#34c759','#ff9500','#af52de','#00b4d8','#ff2d55','#ff3b30','#5856d6','#30b0c7','#32ade6'];

const DEFAULT_MEDS = [
  { id:'m1', name:'异维A酸',  desc:'服满370颗',   color:'#af52de', daily:1, perDose:1, unit:'粒', endDate:'2028-03-08', every:1, startDate:'' },
  { id:'m2', name:'维生素D',  desc:'',            color:'#ff9500', daily:1, perDose:1, unit:'粒', endDate:'',           every:1, startDate:'' },
  { id:'m3', name:'叶黄素',   desc:'',            color:'#ffcc00', daily:1, perDose:1, unit:'粒', endDate:'',           every:1, startDate:'' },
  { id:'m4', name:'奥洛他定', desc:'',            color:'#007aff', daily:3, perDose:1, unit:'滴', endDate:'2026-08-27', every:1, startDate:'' },
  { id:'m5', name:'人工泪液', desc:'',            color:'#007aff', daily:4, perDose:1, unit:'滴', endDate:'2026-08-27', every:1, startDate:'' },
  { id:'m6', name:'氟米龙',   desc:'',            color:'#007aff', daily:3, perDose:1, unit:'滴', endDate:'2026-08-28', every:1, startDate:'' },
];
const DEFAULT_BRACES = { currentSet:8, setStartDate:'2026-08-17', daysPerSet:10, totalSets:19 };

// ─── State ──────────────────────────────────────────
let S = {};
let editingMedId = null; // null = add new
let editingDaily = 2;
let editingEvery = 1;
let editingColor = '#007aff';
let editingAmount = 1;
let bracesTemp = {};

// ─── Utils ──────────────────────────────────────────
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
const p = n => String(n).padStart(2,'0');
const daysBetween = (a,b) => Math.floor((new Date(b)-new Date(a))/86400000);
const load = () => { try { S=JSON.parse(localStorage.getItem(KEY)||'null')||{}; } catch(e){S={};} };
const save = () => localStorage.setItem(KEY, JSON.stringify(S));

function ensureDefaults() {
  if (!S.meds) S.meds = JSON.parse(JSON.stringify(DEFAULT_MEDS));
  if (!S.braces) S.braces = { ...DEFAULT_BRACES };
  if (!S.history) S.history = {};
}

// ─── Render Today ────────────────────────────────────
function renderToday() {
  const today = todayStr();
  if (!S.history[today]) S.history[today] = {};
  const H = S.history[today];

  // Date label
  const now = new Date();
  const wk = ['周日','周一','周二','周三','周四','周五','周六'];
  document.getElementById('dateLabel').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${wk[now.getDay()]}`;

  // Meds
  const container = document.getElementById('medsContainer');
  let sectHtml = `<div class="sec-label">用药</div><div class="meds-grid">`;
  let allDone = true;
  let hasMeds = false;

  S.meds.forEach(m => {
    const ended = m.endDate && today > m.endDate;
    const done = H[m.id] || 0;
    const isSkip = m.every === 2 && (() => {
      const ref = m.startDate || today;
      return daysBetween(ref, today) % 2 !== 0;
    })();

    if (!ended) hasMeds = true;
    if (!ended && !isSkip && done < m.daily) allDone = false;

    // Course tag
    let tagText = '', tagStyle = '';
    if (m.endDate) {
      if (ended) {
        tagText = '停药'; tagStyle = `background:#f2f2f7;color:#8e8e93`;
      } else {
        const rem = daysBetween(today, m.endDate) + 1;
        tagText = `剩${rem}天`;
        tagStyle = rem <= 3 ? `background:#ffeeee;color:#ff3b30` : `background:${m.color}18;color:${m.color}`;
      }
    }

    // Dots
    let dotsHtml = '';
    if (!ended && !isSkip) {
      for (let i = 0; i < m.daily; i++) {
        const filled = i < done;
        dotsHtml += `<div class="dot${filled?' filled':''}" style="--c:${m.color}" onclick="tapDot('${m.id}',${i})">${filled?'✓':i+1}</div>`;
      }
    }

    let labelText = '', labelClass = 'dose-label';
    if (ended) { labelText = '停药'; }
    else if (isSkip) { labelText = '今日免服'; }
    else if (done >= m.daily) { labelText = '✓'; labelClass = 'dose-label complete'; }
    else { labelText = `${done}/${m.daily}`; }

    const descParts = [];
    if (m.desc) descParts.push(m.desc);
    if (m.unit) descParts.push(`每次${m.perDose || 1}${m.unit}`);
    const descLine = descParts.join(' · ');

    sectHtml += `
    <div class="med-card${ended?' ended':''}" id="mc-${m.id}">
      <div class="card-top">
        <div class="card-head">
          <div class="color-bar" style="background:${m.color}"></div>
          <div class="med-name">${m.name}</div>
          ${tagText ? `<div class="course-tag" style="${tagStyle}">${tagText}</div>` : ''}
        </div>
        ${descLine ? `<div class="med-desc">${descLine}</div>` : ''}
      </div>
      <div class="dose-row">
        <div class="dose-dots">${dotsHtml}</div>
        <div class="${labelClass}">${labelText}</div>
      </div>
      ${isSkip && !ended ? `<div class="skip-msg show">💤 明日再服</div>` : ''}
    </div>`;
  });

  sectHtml += '</div>';
  container.innerHTML = sectHtml;
  document.getElementById('doneBanner').classList.toggle('show', allDone && hasMeds);

  renderBraces();
}

function tapDot(medId, dotIdx) {
  const today = todayStr();
  if (!S.history[today]) S.history[today] = {};
  const H = S.history[today];
  const m = S.meds.find(x => x.id === medId);
  if (!m) return;
  if (m.endDate && today > m.endDate) { showToast('疗程已结束'); return; }

  const cur = H[medId] || 0;
  if (dotIdx < cur) {
    H[medId] = dotIdx;
    showToast('已撤销');
  } else {
    H[medId] = dotIdx + 1;
    if (H[medId] === m.daily) showToast(`✅ ${m.name} 今日完成！`);
    else showToast('已记录 · 记得间隔5分钟');
  }
  save();
  renderToday();
}

// ─── Braces ─────────────────────────────────────────
function renderBraces() {
  const b = S.braces;
  const container = document.getElementById('bracesContainer');
  if (!b || !b.setStartDate) { container.innerHTML = ''; return; }

  const today = todayStr();
  const daysSinceStart = daysBetween(b.setStartDate, today); // days since current set started
  const dayInSet = Math.max(1, Math.min(daysSinceStart + 1, b.daysPerSet));
  const isChangeDay = dayInSet >= b.daysPerSet;
  const daysUntilChange = b.daysPerSet - dayInSet;
  const isComplete = b.currentSet > b.totalSets || (b.currentSet === b.totalSets && dayInSet >= b.daysPerSet);

  let statusText, statusClass = 'braces-status';
  if (isComplete) {
    statusText = '🎉 全部疗程已完成';
  } else if (isChangeDay) {
    statusText = `🔔 今天该换第 ${b.currentSet + 1} 副了`;
    statusClass += ' urgent';
  } else {
    statusText = `还有 ${daysUntilChange} 天换副`;
  }

  container.innerHTML = `
  <div class="sec-label">牙套</div>
  <div class="braces-card">
    <div class="braces-top">
      <div class="braces-set-num">第 ${b.currentSet} 副</div>
      <div class="braces-day-tag">${isComplete ? '已完成' : `第 ${dayInSet} 天`}</div>
    </div>
    <div class="${statusClass}">${statusText}</div>
  </div>`;

  // Settings meta
  document.getElementById('bracesSettingsMeta').textContent =
    `第${b.currentSet}副 · 共${b.totalSets}副`;
}

// ─── Usage stats ──────────────────────────────────────
function medUsageStats(m) {
  const today = todayStr();
  const histDates = Object.keys(S.history).sort();
  const start = m.startDate || histDates[0] || today;
  const endBound = (m.endDate && m.endDate < today) ? m.endDate : today;
  if (new Date(start) > new Date(endBound)) return { used: 0, remaining: 0 };

  let expected = 0, used = 0;
  let d = new Date(start);
  const endD = new Date(endBound);
  while (d <= endD) {
    const ds = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
    const isSkip = m.every === 2 && daysBetween(m.startDate || ds, ds) % 2 !== 0;
    if (!isSkip) {
      expected += m.daily;
      used += Math.min(m.daily, (S.history[ds]||{})[m.id] || 0);
    }
    d.setDate(d.getDate() + 1);
  }
  return { used, remaining: Math.max(0, expected - used) };
}

function renderUsage() {
  const wrap = document.getElementById('usageWrap');
  if (!S.meds.length) { wrap.innerHTML = '<div class="empty">📭 暂无药品</div>'; return; }
  wrap.innerHTML = `<div class="usage-card">${S.meds.map(m => {
    const { used, remaining } = medUsageStats(m);
    const unit = m.unit || '次';
    const mult = m.unit ? (m.perDose || 1) : 1;
    return `<div class="usage-row">
      <div class="usage-dot" style="background:${m.color}"></div>
      <div class="usage-name">${m.name}</div>
      <div class="usage-stat">已用 <b>${used * mult}</b>${unit} · 未用 <b>${remaining * mult}</b>${unit}</div>
    </div>`;
  }).join('')}</div>`;
}

// ─── History ────────────────────────────────────────
function renderHistory() {
  renderUsage();
  const wrap = document.getElementById('histWrap');
  const days = Object.keys(S.history).sort().reverse().filter(d => Object.keys(S.history[d]).length > 0);
  if (!days.length) { wrap.innerHTML = '<div class="empty">📭 还没有记录<br>打卡后会显示在这里</div>'; return; }

  const wk = ['日','一','二','三','四','五','六'];
  let html = '';
  days.forEach(day => {
    const H = S.history[day];
    const d = new Date(day);
    html += `<div class="hist-day"><div class="hist-date">${d.getMonth()+1}月${d.getDate()}日 周${wk[d.getDay()]}</div><div class="hist-card">`;
    S.meds.forEach(m => {
      const done = H[m.id] || 0;
      const ended = m.endDate && day > m.endDate;
      const epochDay = Math.floor(new Date(day).getTime()/86400000);
      const isSkip = m.every===2 && epochDay%2!==0;
      let icon, count;
      if (ended) { icon='—'; count='已停药'; }
      else if (isSkip) { icon='💤'; count='免服'; }
      else if (done >= m.daily) { icon='✅'; count=`${done}/${m.daily}`; }
      else if (done > 0) { icon='⭕'; count=`${done}/${m.daily}`; }
      else { icon='❌'; count='未打卡'; }
      html += `<div class="hist-row"><div class="hist-dot" style="background:${m.color}"></div><div class="hist-name">${m.name}</div><div class="hist-count">${count}</div><div class="hist-icon">${icon}</div></div>`;
    });
    html += `</div></div>`;
  });
  wrap.innerHTML = html;
}

// ─── Settings render ─────────────────────────────────
function renderSettings() {
  const list = document.getElementById('medsSettingsList');
  list.innerHTML = S.meds.map(m => {
    const info = m.endDate ? `结束 ${m.endDate}` : '不限疗程';
    return `<div class="settings-row" onclick="openEditMed('${m.id}')">
      <span class="s-dot" style="background:${m.color}"></span>
      <span class="s-name">${m.name}</span>
      <span class="s-meta">${info}</span>
      <span class="s-arrow">›</span>
    </div>`;
  }).join('');
  renderBraces(); // updates settings meta too
}

// ─── Med editing ─────────────────────────────────────
function buildColorRow(selected) {
  document.getElementById('colorRow').innerHTML = COLORS.map(c =>
    `<div class="color-swatch${c===selected?' selected':''}" style="background:${c}" onclick="selectColor('${c}')"></div>`
  ).join('');
  editingColor = selected;
}

function openAddMed() {
  editingMedId = null;
  editingDaily = 2; editingEvery = 1; editingColor = '#007aff'; editingAmount = 1;
  document.getElementById('sheetTitle').textContent = '添加新药品';
  document.getElementById('f-name').value = '';
  document.getElementById('f-desc').value = '';
  document.getElementById('f-daily-val').textContent = editingDaily;
  document.getElementById('f-amount-val').textContent = editingAmount;
  document.getElementById('f-unit').value = '';
  document.getElementById('f-endDate').value = '';
  document.getElementById('f-startDate').value = todayStr();
  document.getElementById('f-every-toggle').className = 'toggle';
  document.getElementById('delLink').style.display = 'none';
  buildColorRow(editingColor);
  document.getElementById('medOverlay').classList.add('show');
}

function openEditMed(id) {
  const m = S.meds.find(x => x.id === id);
  if (!m) return;
  editingMedId = id;
  editingDaily = m.daily; editingEvery = m.every || 1; editingColor = m.color; editingAmount = m.perDose || 1;
  document.getElementById('sheetTitle').textContent = '编辑药品';
  document.getElementById('f-name').value = m.name;
  document.getElementById('f-desc').value = m.desc || '';
  document.getElementById('f-daily-val').textContent = editingDaily;
  document.getElementById('f-amount-val').textContent = editingAmount;
  document.getElementById('f-unit').value = m.unit || '';
  document.getElementById('f-endDate').value = m.endDate || '';
  document.getElementById('f-startDate').value = m.startDate || '';
  document.getElementById('f-every-toggle').className = 'toggle' + (editingEvery===2?' on':'');
  document.getElementById('delLink').style.display = 'block';
  buildColorRow(editingColor);
  document.getElementById('medOverlay').classList.add('show');
}

function closeMedSheet(e) {
  if (e && e.target !== document.getElementById('medOverlay')) return;
  document.getElementById('medOverlay').classList.remove('show');
}

function selectColor(c) {
  editingColor = c;
  document.querySelectorAll('.color-swatch').forEach(el => {
    el.classList.toggle('selected', el.style.background === c || getComputedStyle(el).backgroundColor === hexToRgb(c));
  });
  document.querySelectorAll('#colorRow .color-swatch').forEach(el => {
    el.classList.toggle('selected', el.getAttribute('onclick').includes(c));
  });
  buildColorRow(c);
}

function hexToRgb(hex) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgb(${r}, ${g}, ${b})`;
}

function stepDaily(d) {
  editingDaily = Math.max(1, Math.min(8, editingDaily + d));
  document.getElementById('f-daily-val').textContent = editingDaily;
}

function stepAmount(d) {
  editingAmount = Math.max(1, Math.min(20, editingAmount + d));
  document.getElementById('f-amount-val').textContent = editingAmount;
}

function toggleEvery() {
  editingEvery = editingEvery === 2 ? 1 : 2;
  document.getElementById('f-every-toggle').className = 'toggle' + (editingEvery===2?' on':'');
}

function saveMed() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { showToast('请填写药品名称'); return; }
  if (editingEvery === 2 && !document.getElementById('f-startDate').value) {
    showToast('请填写开始日期'); return;
  }
  const med = {
    id: editingMedId || 'm' + Date.now(),
    name,
    desc: document.getElementById('f-desc').value.trim(),
    color: editingColor,
    daily: editingDaily,
    perDose: editingAmount,
    unit: document.getElementById('f-unit').value.trim(),
    endDate: document.getElementById('f-endDate').value || '',
    startDate: document.getElementById('f-startDate').value || '',
    every: editingEvery,
  };
  if (editingMedId) {
    const idx = S.meds.findIndex(x => x.id === editingMedId);
    if (idx > -1) S.meds[idx] = med;
  } else {
    S.meds.push(med);
  }
  save();
  document.getElementById('medOverlay').classList.remove('show');
  showToast(editingMedId ? '已保存' : '药品已添加');
  renderSettings();
  renderToday();
}

function deleteMed() {
  if (!editingMedId) return;
  if (!confirm('确定删除这个药品吗？打卡记录也会保留但不再显示。')) return;
  S.meds = S.meds.filter(m => m.id !== editingMedId);
  save();
  document.getElementById('medOverlay').classList.remove('show');
  showToast('已删除');
  renderSettings();
  renderToday();
}

// ─── Braces editing ──────────────────────────────────
function openEditBraces() {
  bracesTemp = { ...S.braces };
  document.getElementById('b-cur-val').textContent = bracesTemp.currentSet;
  document.getElementById('b-days-val').textContent = bracesTemp.daysPerSet;
  document.getElementById('b-total-val').textContent = bracesTemp.totalSets;
  document.getElementById('b-startDate').value = bracesTemp.setStartDate || '';
  document.getElementById('bracesOverlay').classList.add('show');
}

function closeBracesSheet(e) {
  if (e && e.target !== document.getElementById('bracesOverlay')) return;
  document.getElementById('bracesOverlay').classList.remove('show');
}

function stepBraces(field, d) {
  if (field === 'cur') { bracesTemp.currentSet = Math.max(1, (bracesTemp.currentSet||1) + d); document.getElementById('b-cur-val').textContent = bracesTemp.currentSet; }
  if (field === 'days') { bracesTemp.daysPerSet = Math.max(1, (bracesTemp.daysPerSet||10) + d); document.getElementById('b-days-val').textContent = bracesTemp.daysPerSet; }
  if (field === 'total') { bracesTemp.totalSets = Math.max(1, (bracesTemp.totalSets||19) + d); document.getElementById('b-total-val').textContent = bracesTemp.totalSets; }
}

function saveBraces() {
  bracesTemp.setStartDate = document.getElementById('b-startDate').value;
  if (!bracesTemp.setStartDate) { showToast('请选择本副开始日期'); return; }
  S.braces = { ...bracesTemp };
  save();
  document.getElementById('bracesOverlay').classList.remove('show');
  showToast('牙套设置已保存');
  renderSettings();
  renderToday();
}

// ─── Nav ────────────────────────────────────────────
function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('pg-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'history') renderHistory();
  if (name === 'settings') renderSettings();
  if (name === 'today') renderToday();
}

// ─── Toast ──────────────────────────────────────────
let _t;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_t); _t = setTimeout(() => el.classList.remove('show'), 2200);
}

// ─── Boot ───────────────────────────────────────────
(function () {
  load();
  ensureDefaults();
  save();
  renderToday();
})();
</script>
